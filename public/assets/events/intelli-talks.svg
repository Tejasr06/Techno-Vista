<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f1f4b"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Tech Grid Background -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>
  <!-- Futuristic Research Hologram / Podium -->
  <g transform="translate(400, 220)">
    <!-- Concentric glowing rings -->
    <ellipse cx="0" cy="120" rx="220" ry="40" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
    <ellipse cx="0" cy="120" rx="150" ry="26" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.7" stroke-dasharray="8 6"/>
    <ellipse cx="0" cy="120" rx="80" ry="14" fill="#38bdf8" opacity="0.15"/>

    <!-- Floating holographic paper / scientific presentation board -->
    <rect x="-140" y="-120" width="280" height="190" rx="14" fill="#0f172a" stroke="url(#glow)" stroke-width="3" filter="url(#neon)"/>
    
    <!-- Paper header bars -->
    <rect x="-115" y="-95" width="90" height="10" rx="4" fill="#38bdf8"/>
    <rect x="-115" y="-75" width="230" height="4" rx="2" fill="#64748b"/>
    <rect x="-115" y="-60" width="210" height="4" rx="2" fill="#64748b"/>
    <rect x="-115" y="-45" width="180" height="4" rx="2" fill="#64748b"/>

    <!-- Neural / AI Graph on Paper -->
    <circle cx="-50" cy="15" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="20" cy="-10" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <circle cx="70" cy="25" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="45" r="8" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <line x1="-50" y1="15" x2="20" y2="-10" stroke="#38bdf8" stroke-width="2"/>
    <line x1="20" y1="-10" x2="70" y2="25" stroke="#818cf8" stroke-width="2"/>
    <line x1="-50" y1="15" x2="0" y2="45" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="70" y2="25" stroke="#c084fc" stroke-width="1.5"/>

    <!-- Presentation beam / spotlight projection -->
    <polygon points="-80,120 80,120 140,-120 -140,-120" fill="url(#glow)" opacity="0.08"/>
  </g>
  <!-- Text Label -->
  <text x="400" y="440" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="3">INTELLI TALKS</text>
  <text x="400" y="470" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">NATIONAL PAPER PRESENTATION SYMPOSIUM</text>
</svg>

