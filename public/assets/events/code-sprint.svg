<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061f1c"/>
      <stop offset="50%" stop-color="#0c2e26"/>
      <stop offset="100%" stop-color="#051412"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Matrix / Binary code columns in background -->
  <g fill="#10b981" opacity="0.12" font-family="'JetBrains Mono', monospace" font-size="12">
    <text x="60" y="80">01100011 01101111</text>
    <text x="60" y="140">01100100 01100101</text>
    <text x="60" y="200">01110011 01110000</text>
    <text x="60" y="260">01110010 01101001</text>
    <text x="660" y="80">std::vector&lt;int&gt;</text>
    <text x="660" y="140">dp[i][j] = min(..)</text>
    <text x="660" y="200">time: O(N log N)</text>
    <text x="660" y="260">AC 100/100 PTS</text>
  </g>
  <!-- Cyber IDE Terminal Window -->
  <g transform="translate(400, 210)">
    <rect x="-190" y="-120" width="380" height="230" rx="14" fill="#091512" stroke="url(#codeGrad)" stroke-width="3" filter="url(#neon)"/>
    <!-- Window Bar -->
    <rect x="-190" y="-120" width="380" height="34" rx="14" fill="#042019"/>
    <circle cx="-165" cy="-103" r="5" fill="#ef4444"/>
    <circle cx="-148" cy="-103" r="5" fill="#f59e0b"/>
    <circle cx="-131" cy="-103" r="5" fill="#10b981"/>
    <text x="0" y="-98" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6ee7b7" text-anchor="middle">terminal@code-sprint: ~/arena</text>
    
    <!-- Code Lines inside IDE -->
    <text x="-160" y="-60" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34d399">&gt; function solveChallenge(graph, source) {</text>
    <text x="-140" y="-35" font-family="'JetBrains Mono', monospace" font-size="13" fill="#38bdf8">    const queue = new PriorityQueue();</text>
    <text x="-140" y="-10" font-family="'JetBrains Mono', monospace" font-size="13" fill="#93c5fd">    dist[source] = 0; queue.push(source);</text>
    <text x="-140" y="15" font-family="'JetBrains Mono', monospace" font-size="13" fill="#a7f3d0">    while (!queue.isEmpty()) { ... }</text>
    <text x="-140" y="40" font-family="'JetBrains Mono', monospace" font-size="13" fill="#fbbf24">    return calculateOptimalPath();</text>
    <text x="-160" y="65" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34d399">}</text>
    
    <!-- Success Badge -->
    <rect x="-160" y="80" width="180" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="-70" y="94" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a7f3d0" text-anchor="middle">✔ ALL TEST CASES PASSED</text>
  </g>
  <text x="400" y="440" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="3">CODE SPRINT</text>
  <text x="400" y="470" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#a7f3d0" text-anchor="middle" letter-spacing="1.5">HIGH-OCTANE ALGORITHMIC PROGRAMMING ARENA</text>
</svg>

