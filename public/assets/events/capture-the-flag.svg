<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#200814"/>
      <stop offset="50%" stop-color="#300c1e"/>
      <stop offset="100%" stop-color="#0e0409"/>
    </linearGradient>
    <linearGradient id="cyberRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Cyber Security Shield & Flag -->
  <g transform="translate(400, 210)">
    <!-- Radar Circle Rings -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fb7185" stroke-width="1" opacity="0.5"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#f43f5e" stroke-width="1" opacity="0.2"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#f43f5e" stroke-width="1" opacity="0.2"/>

    <!-- Cyber Shield Silhouette -->
    <path d="M0 -110 L90 -70 V10 C90 70 0 115 0 115 C0 115 -90 70 -90 10 V-70 Z" fill="#1b0811" stroke="url(#cyberRed)" stroke-width="3.5" filter="url(#neon)"/>
    
    <!-- Flagpole & Cyber Flag inside Shield -->
    <!-- Pole -->
    <line x1="-30" y1="-50" x2="-30" y2="60" stroke="#fecdd3" stroke-width="4" stroke-linecap="round"/>
    <!-- Glowing Red Triangular Flag -->
    <path d="M-30 -45 L45 -20 L-30 5 Z" fill="url(#cyberRed)" filter="url(#neon)"/>
    <circle cx="-30" cy="-52" r="5" fill="#fff"/>

    <!-- Keyhole / Encryption lock -->
    <circle cx="10" cy="20" r="10" fill="none" stroke="#fb7185" stroke-width="3"/>
    <polygon points="6,27 14,27 16,42 4,42" fill="#fb7185"/>

    <!-- Hex code tags -->
    <text x="0" y="85" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fda4af" text-anchor="middle">FLAG{7ECH_V157A_PWN3D}</text>
  </g>
  <text x="400" y="440" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="3">CAPTURE THE FLAG</text>
  <text x="400" y="470" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#fda4af" text-anchor="middle" letter-spacing="1.5">CYBERSECURITY, ETHICAL HACKING &amp; FORENSICS</text>
</svg>

