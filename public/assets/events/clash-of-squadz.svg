<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140624"/>
      <stop offset="50%" stop-color="#21083c"/>
      <stop offset="100%" stop-color="#0a0214"/>
    </linearGradient>
    <linearGradient id="esportsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Esports Crosshair & Gaming Controller -->
  <g transform="translate(400, 210)">
    <!-- Targeting Crosshair Circles -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
    <line x1="-180" y1="0" x2="-120" y2="0" stroke="#a855f7" stroke-width="3"/>
    <line x1="120" y1="0" x2="180" y2="0" stroke="#a855f7" stroke-width="3"/>
    <line x1="0" y1="-180" x2="0" y2="-120" stroke="#a855f7" stroke-width="3"/>
    <line x1="0" y1="120" x2="0" y2="180" stroke="#a855f7" stroke-width="3"/>

    <!-- Cyber Gamepad Silhouette -->
    <path d="M-130 50 C-150 0 -120 -60 -60 -60 H60 C120 -60 150 0 130 50 C115 85 70 85 45 45 C30 20 -30 20 -45 45 C-70 85 -115 85 -130 50 Z" 
          fill="#1b0a2a" stroke="url(#esportsGrad)" stroke-width="3.5" filter="url(#neon)"/>
    
    <!-- D-Pad (Left) -->
    <rect x="-85" y="-20" width="30" height="10" rx="3" fill="#a855f7"/>
    <rect x="-75" y="-30" width="10" height="30" rx="3" fill="#a855f7"/>

    <!-- Action Buttons (Right) -->
    <circle cx="65" cy="-22" r="5.5" fill="#f43f5e"/>
    <circle cx="80" cy="-7" r="5.5" fill="#3b82f6"/>
    <circle cx="50" cy="-7" r="5.5" fill="#10b981"/>
    <circle cx="65" cy="8" r="5.5" fill="#fbbf24"/>

    <!-- Thumbsticks -->
    <circle cx="-30" cy="0" r="14" fill="#381555" stroke="#ec4899" stroke-width="2"/>
    <circle cx="30" cy="0" r="14" fill="#381555" stroke="#ec4899" stroke-width="2"/>

    <!-- Crown / Trophy icon above gamepad -->
    <polygon points="-25,-75 -15,-60 0,-85 15,-60 25,-75 20,-50 -20,-50" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" filter="url(#neon)"/>
  </g>
  <text x="400" y="440" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="3">CLASH OF SQUADZ</text>
  <text x="400" y="470" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#e9d5ff" text-anchor="middle" letter-spacing="1.5">TACTICAL LAN ESPORTS &amp; BATTLE ARENA</text>
</svg>
